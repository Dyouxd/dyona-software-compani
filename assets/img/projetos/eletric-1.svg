<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="70" fill="#00b894"/>
  <text x="30" y="45" font-family="sans-serif" font-size="20" font-weight="700"
        fill="#fff">⚡ Eletric Orçamento</text>
  <circle cx="760" cy="35" r="18" fill="#fff" opacity="0.3"/>
  
  <!-- Card de orçamento -->
  <rect x="30" y="100" width="740" height="380" rx="12" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  
  <text x="60" y="140" font-family="sans-serif" font-size="18" font-weight="700"
        fill="#0D0D0D">Novo Orçamento #2024-001</text>
  
  <line x1="60" y1="160" x2="740" y2="160" stroke="#e0e0e0" stroke-width="1"/>
  
  <!-- Cliente -->
  <text x="60" y="190" font-family="sans-serif" font-size="12" fill="#666">CLIENTE</text>
  <rect x="60" y="200" width="300" height="35" rx="6" fill="#f1f3f5"/>
  <text x="75" y="223" font-family="sans-serif" font-size="13" fill="#333">João Silva</text>
  
  <text x="400" y="190" font-family="sans-serif" font-size="12" fill="#666">DATA</text>
  <rect x="400" y="200" width="150" height="35" rx="6" fill="#f1f3f5"/>
  <text x="415" y="223" font-family="sans-serif" font-size="13" fill="#333">19/09/2026</text>
  
  <!-- Itens -->
  <text x="60" y="280" font-family="sans-serif" font-size="14" font-weight="600"
        fill="#0D0D0D">Itens do orçamento:</text>
  
  <rect x="60" y="300" width="660" height="40" fill="#f8f9fa"/>
  <text x="75" y="325" font-family="sans-serif" font-size="13" fill="#333">Fiação 2.5mm - 50m</text>
  <text x="650" y="325" font-family="sans-serif" font-size="13" font-weight="600"
        fill="#0D0D0D">R$ 250,00</text>
  
  <rect x="60" y="345" width="660" height="40" fill="#fff"/>
  <text x="75" y="370" font-family="sans-serif" font-size="13" fill="#333">Disjuntor 20A</text>
  <text x="650" y="370" font-family="sans-serif" font-size="13" font-weight="600"
        fill="#0D0D0D">R$ 45,00</text>
  
  <rect x="60" y="390" width="660" height="40" fill="#f8f9fa"/>
  <text x="75" y="415" font-family="sans-serif" font-size="13" fill="#333">Mão de obra</text>
  <text x="650" y="415" font-family="sans-serif" font-size="13" font-weight="600"
        fill="#0D0D0D">R$ 200,00</text>
  
  <!-- Total -->
  <rect x="60" y="440" width="660" height="30" fill="#00b894" opacity="0.1"/>
  <text x="580" y="460" font-family="sans-serif" font-size="13" font-weight="600"
        fill="#00b894">TOTAL</text>
  <text x="650" y="460" font-family="sans-serif" font-size="16" font-weight="700"
        fill="#00b894">R$ 495,00</text>
</svg>