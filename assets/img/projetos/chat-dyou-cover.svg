<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="chatBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#a29bfe"/>
    </linearGradient>
    <radialGradient id="chatGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="400" fill="url(#chatBg)"/>
  <circle cx="300" cy="160" r="220" fill="url(#chatGlow)"/>

  <!-- Balão de chat grande -->
  <g transform="translate(300, 180)">
    <ellipse cx="0" cy="0" rx="100" ry="75" fill="#ffffff" opacity="0.95"/>
    <path d="M -30 60 L -10 90 L 10 60 Z" fill="#ffffff" opacity="0.95"/>
    <!-- 3 pontinhos -->
    <circle cx="-30" cy="0" r="8" fill="#6C5CE7"/>
    <circle cx="0" cy="0" r="8" fill="#6C5CE7"/>
    <circle cx="30" cy="0" r="8" fill="#6C5CE7"/>
  </g>

  <!-- Mini corações flutuantes -->
  <circle cx="120" cy="80" r="15" fill="#00FF88" opacity="0.6"/>
  <circle cx="490" cy="100" r="12" fill="#00FF88" opacity="0.6"/>
  <circle cx="80" cy="300" r="10" fill="#ffffff" opacity="0.4"/>
  <circle cx="520" cy="320" r="14" fill="#ffffff" opacity="0.4"/>
</svg>