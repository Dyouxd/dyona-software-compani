<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="telaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a9396"/>
      <stop offset="100%" stop-color="#005f73"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#telaBg)"/>
  
  <!-- Card branco central -->
  <rect x="240" y="80" width="320" height="340" rx="20" fill="#ffffff"/>
  
  <!-- Logo tartaruga -->
  <circle cx="400" cy="130" r="22" fill="#2d6a4f"/>
  <circle cx="400" cy="130" r="18" fill="#52b788"/>
  
  <!-- Título -->
  <text x="400" y="180" font-family="sans-serif" font-size="22" font-weight="700"
        fill="#0D0D0D" text-anchor="middle">CHAT DO DYOU</text>
  <text x="400" y="202" font-family="sans-serif" font-size="11"
        fill="#666" text-anchor="middle">Seu assistente pessoal inteligente</text>
  
  <!-- Botões -->
  <rect x="270" y="230" width="260" height="40" rx="20" fill="none" stroke="#2d6a4f" stroke-width="2"/>
  <text x="400" y="255" font-family="sans-serif" font-size="13" font-weight="600"
        fill="#2d6a4f" text-anchor="middle">☁ Criar Conta na Nuvem</text>
  
  <rect x="270" y="282" width="260" height="40" rx="20" fill="none" stroke="#2d6a4f" stroke-width="2"/>
  <text x="400" y="307" font-family="sans-serif" font-size="13" font-weight="600"
        fill="#2d6a4f" text-anchor="middle">🔑 Login na Nuvem</text>
  
  <rect x="270" y="334" width="260" height="40" rx="20" fill="none" stroke="#e76f51" stroke-width="2"/>
  <text x="400" y="359" font-family="sans-serif" font-size="13" font-weight="600"
        fill="#e76f51" text-anchor="middle">📱 Criar Conta Offline</text>
  
  <rect x="270" y="386" width="260" height="40" rx="20" fill="none" stroke="#4361ee" stroke-width="2"/>
  <text x="400" y="411" font-family="sans-serif" font-size="13" font-weight="600"
        fill="#4361ee" text-anchor="middle">👤 Usar Anonimamente</text>
</svg>