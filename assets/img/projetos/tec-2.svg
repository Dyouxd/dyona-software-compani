<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <rect x="0" y="0" width="800" height="70" fill="#e17055"/>
  <text x="30" y="45" font-family="sans-serif" font-size="20" font-weight="700"
        fill="#fff">📋 Nova Ordem de Serviço</text>
  
  <!-- Form -->
  <rect x="30" y="100" width="740" height="380" rx="12" fill="#fff"/>
  
  <text x="60" y="140" font-family="sans-serif" font-size="12" fill="#666">CLIENTE</text>
  <rect x="60" y="150" width="340" height="40" rx="8" fill="#f1f3f5"/>
  <text x="75" y="175" font-family="sans-serif" font-size="13" fill="#333">Maria Santos</text>
  
  <text x="420" y="140" font-family="sans-serif" font-size="12" fill="#666">TELEFONE</text>
  <rect x="420" y="150" width="320" height="40" rx="8" fill="#f1f3f5"/>
  <text x="435" y="175" font-family="sans-serif" font-size="13" fill="#333">(11) 99999-9999</text>
  
  <text x="60" y="220" font-family="sans-serif" font-size="12" fill="#666">TIPO DE SERVIÇO</text>
  <rect x="60" y="230" width="340" height="40" rx="8" fill="#f1f3f5"/>
  <text x="75" y="255" font-family="sans-serif" font-size="13" fill="#333">Instalação elétrica</text>
  
  <text x="420" y="220" font-family="sans-serif" font-size="12" fill="#666">PRIORIDADE</text>
  <rect x="420" y="230" width="320" height="40" rx="8" fill="#ffe0db"/>
  <text x="435" y="255" font-family="sans-serif" font-size="13" font-weight="600"
        fill="#e17055">🔴 Alta</text>
  
  <text x="60" y="300" font-family="sans-serif" font-size="12" fill="#666">DESCRIÇÃO</text>
  <rect x="60" y="310" width="680" height="100" rx="8" fill="#f1f3f5"/>
  <text x="75" y="335" font-family="sans-serif" font-size="12" fill="#333">
    Instalação completa de quadro de distribuição
  </text>
  <text x="75" y="355" font-family="sans-serif" font-size="12" fill="#333">
    com disjuntores e cabeamento novo.
  </text>
  
  <rect x="60" y="430" width="200" height="40" rx="20" fill="#e17055"/>
  <text x="160" y="455" font-family="sans-serif" font-size="13" font-weight="600"
        fill="#fff" text-anchor="middle">Salvar Ordem</text>
  
  <rect x="280" y="430" width="200" height="40" rx="20" fill="none" stroke="#e17055" stroke-width="2"/>
  <text x="380" y="455" font-family="sans-serif" font-size="13" font-weight="600"
        fill="#e17055" text-anchor="middle">Cancelar</text>
</svg>