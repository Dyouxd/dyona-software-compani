<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D47A1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E3F2FD;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bgGrad)"/>

  <!-- Elementos decorativos de fundo -->
  <circle cx="80" cy="70" r="40" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="540" cy="330" r="60" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="500" cy="80" r="25" fill="#FFC107" opacity="0.15"/>

  <!-- Logo circular -->
  <circle cx="300" cy="160" r="70" fill="url(#circleGrad)" opacity="0.95"/>
  <circle cx="300" cy="160" r="55" fill="#0D47A1"/>

  <!-- Ícone carrinho de compras -->
  <g transform="translate(300, 160)">
    <path d="M-25,-15 L-20,-15 L-15,15 L20,15 L25,-5 L-18,-5" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-12" cy="22" r="4" fill="#FFFFFF"/>
    <circle cx="15" cy="22" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Detalhe amarelo -->
  <circle cx="345" cy="115" r="14" fill="#FFC107"/>
  <path d="M338,115 L343,120 L352,110" stroke="#0D47A1" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Nome CartFolio -->
  <text x="300" y="270" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">Cart<tspan fill="#FFC107">Folio</tspan></text>

  <!-- Subtítulo -->
  <text x="300" y="305" font-family="Arial, sans-serif" font-size="14" fill="#FFC107" text-anchor="middle" letter-spacing="4">SUA LISTA INTELIGENTE</text>

  <!-- Rodapé com marca -->
  <text x="300" y="370" font-family="Arial, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.6" text-anchor="middle" letter-spacing="2">by Dyona Software Compani</text>
</svg>