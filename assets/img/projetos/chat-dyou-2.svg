<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0f172a"/>
  
  <!-- Sidebar -->
  <rect x="0" y="0" width="200" height="500" fill="#1e293b"/>
  <circle cx="100" cy="50" r="20" fill="#52b788"/>
  <text x="100" y="56" font-family="sans-serif" font-size="18" font-weight="700"
        fill="#fff" text-anchor="middle">D</text>
  
  <rect x="20" y="100" width="160" height="35" rx="8" fill="#334155"/>
  <text x="30" y="123" font-family="sans-serif" font-size="11" fill="#94a3b8">Conversa 1</text>
  
  <rect x="20" y="145" width="160" height="35" rx="8" fill="#334155"/>
  <text x="30" y="168" font-family="sans-serif" font-size="11" fill="#94a3b8">Conversa 2</text>
  
  <rect x="20" y="190" width="160" height="35" rx="8" fill="#6C5CE7"/>
  <text x="30" y="213" font-family="sans-serif" font-size="11" fill="#fff">Conversa 3</text>
  
  <!-- Área do chat -->
  <rect x="200" y="0" width="600" height="70" fill="#1e293b"/>
  <text x="230" y="45" font-family="sans-serif" font-size="16" font-weight="600"
        fill="#fff">Chat do Dyou</text>
  
  <!-- Balões -->
  <rect x="230" y="100" width="280" height="50" rx="12" fill="#334155"/>
  <text x="245" y="130" font-family="sans-serif" font-size="13" fill="#fff">Olá! Como posso ajudar?</text>
  
  <rect x="360" y="170" width="220" height="50" rx="12" fill="#6C5CE7"/>
  <text x="375" y="200" font-family="sans-serif" font-size="13" fill="#fff">Preciso de ajuda</text>
  
  <rect x="230" y="240" width="320" height="50" rx="12" fill="#334155"/>
  <text x="245" y="270" font-family="sans-serif" font-size="13" fill="#fff">Claro! Em que posso ajudar?</text>
  
  <!-- Input -->
  <rect x="220" y="430" width="480" height="50" rx="25" fill="#334155"/>
  <text x="250" y="462" font-family="sans-serif" font-size="13" fill="#94a3b8">Digite sua mensagem...</text>
  <circle cx="680" cy="455" r="18" fill="#6C5CE7"/>
</svg>