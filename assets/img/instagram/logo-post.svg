<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0D0D"/>
      <stop offset="100%" stop-color="#1a1140"/>
    </linearGradient>
    <linearGradient id="roxoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#a29bfe"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6C5CE7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6C5CE7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fundo -->
  <rect width="1080" height="1080" fill="url(#bg)"/>
  
  <!-- Glow central -->
  <circle cx="540" cy="440" r="400" fill="url(#glow)"/>
  
  <!-- Ícone -->
  <g transform="translate(390, 250)">
    <rect x="0" y="0" width="300" height="300" rx="70" fill="url(#roxoGrad)"/>
    <rect x="0" y="0" width="300" height="300" rx="70" 
          fill="none" stroke="#a29bfe" stroke-width="3" opacity="0.5"/>
    <path d="M 80 60 L 150 60 C 220 60, 240 110, 240 150 C 240 190, 220 240, 150 240 L 80 240 Z
             M 115 105 L 115 195 L 150 195 C 195 195, 200 175, 200 150 C 200 125, 195 105, 150 105 Z"
          fill="#0D0D0D"/>
    <text x="150" y="175" font-family="monospace" font-size="65" font-weight="bold"
          fill="#00FF88" text-anchor="middle">&lt;/&gt;</text>
  </g>
  
  <!-- Nome Dyona -->
  <text x="540" y="680" font-family="'Space Grotesk', sans-serif"
        font-size="130" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-3">
    Dyona
  </text>
  
  <!-- Subtítulo -->
  <text x="540" y="740" font-family="'Inter', sans-serif"
        font-size="32" font-weight="600" fill="#a29bfe" text-anchor="middle" letter-spacing="12">
    SOFTWARE COMPANI
  </text>
  
  <!-- Linha decorativa -->
  <rect x="420" y="780" width="240" height="4" rx="2" fill="#00FF88"/>
  
  <!-- Tagline -->
  <text x="540" y="870" font-family="'Inter', sans-serif"
        font-size="28" font-weight="400" fill="#b8b8b8" text-anchor="middle">
    Sites · Sistemas Web · Softwares
  </text>
</svg>